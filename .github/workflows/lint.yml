name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Test placeholder renderer
        run: php tests/renderer.php

      - name: Test MODX mail adapter
        run: php tests/mailer.php

      - name: Test public form guard
        run: php tests/public_guard.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JavaScript
        run: find assets/components/dnepritnewsletter/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate xPDO schema XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('core/components/dnepritnewsletter/schema/dnepritnewsletter.mysql.schema.xml')"

  release-package:
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'agent/release-package' || startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MODX_VERSION: 2.8.1-pl
      MODX_DIR: ${{ runner.temp }}/modx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, pdo_mysql, zip, mbstring, xml, gd, curl
          coverage: none

      - name: Download MODX Revolution
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/modxcms/revolution/archive/refs/tags/v${MODX_VERSION}.zip" \
            -o "${RUNNER_TEMP}/modx.zip"
          unzip -q "${RUNNER_TEMP}/modx.zip" -d "${RUNNER_TEMP}"
          mv "${RUNNER_TEMP}/revolution-${MODX_VERSION}" "${MODX_DIR}"
          mkdir -p \
            "${MODX_DIR}/core/cache" \
            "${MODX_DIR}/core/config" \
            "${MODX_DIR}/core/packages"
          chmod -R u+rwX "${MODX_DIR}"

      - name: Install clean MODX
        shell: bash
        run: |
          set -euo pipefail
          php "${MODX_DIR}/setup/cli-install.php" \
            --mode=new \
            --database_type=mysql \
            --database_server=127.0.0.1 \
            --database=modx \
            --database_user=root \
            --database_password=root \
            --database_connection_charset=utf8 \
            --database_charset=utf8 \
            --database_collation=utf8_general_ci \
            --table_prefix=modx_ \
            --https_port=443 \
            --http_host=localhost \
            --inplace=0 \
            --unpacked=0 \
            --language=en \
            --cmsadmin=admin \
            --cmspassword=DnepritNewsletter-CI-123! \
            --cmsadminemail=ci@example.invalid \
            --context_web_path="${MODX_DIR}/" \
            --context_web_url=/ \
            --core_path="${MODX_DIR}/core/" \
            --context_mgr_path="${MODX_DIR}/manager/" \
            --context_mgr_url=/manager/ \
            --context_connectors_path="${MODX_DIR}/connectors/" \
            --context_connectors_url=/connectors/ \
            --remove_setup_directory=0

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _dist
          MODX_BASE_PATH="${MODX_DIR}" php _build/build.transport.php
          test -s "_dist/dnepritnewsletter-0.1.0-beta1.transport.zip"
          (
            cd _dist
            sha256sum --check "dnepritnewsletter-0.1.0-beta1.transport.zip.sha256"
          )

      - name: Install and smoke test package
        shell: bash
        run: |
          set -euo pipefail
          MODX_BASE_PATH="${MODX_DIR}" php _build/install.smoke.php \
            "_dist/dnepritnewsletter-0.1.0-beta1.transport.zip"
